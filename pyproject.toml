[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specbot"
version = "0.1.0"
description = "Screenshot and keypress automation for ZX Spectrum emulators on Windows"
readme = "specbot/README.md"
requires-python = ">=3.11"
dependencies = [
    "mss",
    "Pillow",
    "pywin32; sys_platform == 'win32'",
    "pydirectinput; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest"]
agent = ["claude-agent-sdk"]    # for specdev
hosted = ["claude-agent-sdk", "python-xlib", "PyJWT[crypto]", "boto3"]    # specdev on a Linux server (deploy/)

[project.scripts]
specbot = "specbot.cli:main"

[tool.setuptools]
packages = ["specbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs Windows and a running emulator (run with `pytest -m integration`)",
]
addopts = "-m 'not integration'"
